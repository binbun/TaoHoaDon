version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: taohoadon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: quotations_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: taohoadon_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: "postgresql://postgres:password123@postgres:5432/quotations_db?schema=public"
      JWT_SECRET: "super-secret-quotation-jwt-token-key-2026"
      CLIENT_URL: "http://localhost:5173"
    depends_on:
      - postgres

volumes:
  postgres_data:
